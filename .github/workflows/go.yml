# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26'

    - name: Build Linux
      run: go build -v ./... -o yadiskreaper-linux
      env:
        GOARCH: linux
      
    - name: Build Windows
      run: go build -v ./... -o yadiskreaper-win
      env:
        GOARCH: windows

    - name: Test
      run: go test -v ./...
