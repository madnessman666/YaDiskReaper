[package]
name = "yadiskreaper-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Lightweight desktop GUI for YaDiskReaper"
license = "GPL-3.0"

[[bin]]
name = "yadiskreaper-gui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "clipboard",
    "wayland",
    "x11",
] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
